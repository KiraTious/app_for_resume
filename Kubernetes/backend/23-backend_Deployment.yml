apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: fleettracker

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend
  
  template:
    metadata:
      labels:
        app: backend
    
    spec:
      containers:
      - name: backend-container
        image: 192.168.1.6:12000/fleettracker-backend:v3
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000

        envFrom:
          - secretRef:
              name: backend-secret

          - configMapRef:
              name: backend-configmap
        
        startupProbe:
          tcpSocket:
            port: 5000
          initialDelaySeconds: 10
          failureThreshold: 5
          periodSeconds: 5

        livenessProbe:
          tcpSocket:
            port: 5000
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        
        resources:
          requests:
            cpu: "100m"
            memory: "300Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"