apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: postgres-statefulset
  namespace: fleettracker

spec:
  serviceName: postgres-service

  replicas: 1

  selector:
    matchLabels:
      app: postgres
  
  template:
    metadata:
      labels: 
        app: postgres
    
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine

        ports:
        - containerPort: 5432
        
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        
        envFrom:
        - secretRef:
            name: postgres-secret
          
        - configMapRef:
            name: postgres-configmap
        
        resources:
          requests:
            cpu: "500m"
            memory: "2G"
      
        readinessProbe:
          exec:
            command:
              - pg_isready
              - -U
              - postgres

        livenessProbe:
          exec:
            command:
              - pg_isready
              - -U
              - postgres

  volumeClaimTemplates:
  - metadata:
      name: postgres-storage
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
